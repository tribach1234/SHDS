<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="Login.css">
    <title>Login</title>
</head>
<body>
    <div>
        <div class="container">

        <!-- Login Form -->
        <div class="Login">
            <form action="">
                <h1>Đăng nhập</h1>
                <div class="input-box">
                    <input type="text" placeholder="Tên đăng nhập, email" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Mật khẩu" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="forget-link">
                    <a href="">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn">Đăng nhập</button>
                <p>Hoặc đăng nhập bằng phương thức khác?</p>
                <div class="social-icon">
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-google"></i></a>
                    <a href=""><i class="fa-brands fa-instagram"></i></a>
                    <a href=""><i class="fa-brands fa-twitter"></i></a>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="Register">
            <form action="">
                <h1>Đăng ký</h1>
                <div class="input-box">
                    <input type="text" placeholder="Tên đăng nhập" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="eamil" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Mật khẩu" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Đăng ký</button>
                <p>Hoặc đăng ký bằng phương thức khác?</p>
                <div class="social-icon">
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-google"></i></a>
                    <a href=""><i class="fa-brands fa-instagram"></i></a>
                    <a href=""><i class="fa-brands fa-twitter"></i></a>
                </div>
            </form>
        </div>

        <!-- Toggle Box --> 
        <div class="Box">

            <!-- Toggle Box Left -->
             <div class="toggle panel left"></div>
                <h1>Xin chào, chào mừng bạn đến với (...)</h1>
                <p>Bạn chưa có tài khoản?</p>
                <button class="btn-register">Register</button>
            <!-- Toggle Box Right -->
             <div class="toggle paner right">
                <h1>Chào mừng bạn đã quay trở lại</h1>
                <p>Bạn đã có tài khoản?</p>
                <button class="btn-login">Login</button>
             </div>

        </div>
        </div>
    </div>
</body>
</html>
