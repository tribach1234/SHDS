<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b9dda0" />
  <title>EduGreen - Phúc khảo</title>
  <link rel="stylesheet" href="teacher.css" />
</head>

<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.8A2.8 2.8 0 0 0 4 20.8V5.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 18.5M8 7h8M8 11h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="m8 9 1.5 1.5L12 8M14 9h3M8 15h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.3a3 3 0 0 1 0 5.4M16.5 14.7A5.5 5.5 0 0 1 20.5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.7 20h18.6L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /><path d="M12 9v5M12 17.3v.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" /><path d="m20 20-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M8 3v4M16 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
    <symbol id="i-class" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM7 9h5M7 13h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <div class="brand">
        <div class="brand-mark"><svg><use href="#i-book"></use></svg></div>
        <span>EduGreen</span>
      </div>

      <div class="nav-label">Không gian giáo viên</div>
      <nav class="nav">
        <a class="nav-item" href="teacher-overview.html">
          <svg><use href="#i-home"></use></svg>
          <span>Tổng quan</span>
        </a>
        <a class="nav-item" href="teacher-assignmentManage.html">
          <svg><use href="#i-task"></use></svg>
          <span>Quản lý bài tập</span>
        </a>
        <a class="nav-item active" href="teacher-phuckhao.html" aria-current="page">
          <svg><use href="#i-alert"></use></svg>
          <span>Phúc khảo</span>
        </a>
        <a class="nav-item" href="#" onclick="comingSoon('Lớp học'); return false;">
          <svg><use href="#i-users"></use></svg>
          <span>Lớp học</span>
        </a>
        <a class="nav-item" href="#" onclick="comingSoon('Kết quả học tập'); return false;">
          <svg><use href="#i-chart"></use></svg>
          <span>Kết quả học tập</span>
        </a>
        <a class="nav-item" href="teacher-grading.html">
          <svg>
            <use href="#i-check"></use>
          </svg>
          <span>Chấm bài</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">
      <header class="topbar">
        <div class="heading-group">
          <button class="mobile-menu" id="mobileMenuBtn" aria-label="Mở menu">
            <svg><use href="#i-search"></use></svg>
          </button>
          <div class="page-heading">
            <h1>Phúc khảo</h1>
            <p>Danh sách học sinh yêu cầu phúc khảo cho bài tập của bạn.</p>
          </div>
        </div>

        <div class="teacher-chip" aria-label="Tài khoản giáo viên">
          <div class="avatar">GV</div>
          <div class="teacher-text">
            <strong>Giáo viên</strong>
            <span>Teacher Workspace</span>
          </div>
          <button type="button" onclick="handleLogout()" style="margin-left:12px;background:transparent;border:1px solid #ccc;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;">Đăng xuất</button>
        </div>
      </header>

      <section class="workspace">
        <div class="list-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <h2>Yêu cầu phúc khảo</h2>
          <div style="display: flex; align-items: center; gap: 12px;">
            <select id="classFilter" aria-label="Lọc theo lớp học" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; background: #fff; cursor: pointer;">
              <option value="">Tất cả lớp học</option>
            </select>
            <span class="result-count" id="requestCount">0 yêu cầu</span>
          </div>
        </div>

        <div id="requestList">
          <p style="padding:16px;color:#888">Đang tải yêu cầu phúc khảo...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../shared_auth.js"></script>
  <script src="teacher-phuckhao.js"></script>
</body>
</html>
