<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHDS - Create Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Nút giả lập để mở Modal (chỉ dùng để test) -->
    <button class="btn btn-primary" onclick="openModal()" style="margin: 20px;">
        <i class="fa-solid fa-plus"></i> Open Create Assignment Modal
    </button>

    <!-- KHOẢNG MỜ NỀN (Overlay) & MODAL -->
    <div id="assignmentModal" class="modal-overlay">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h2>Create New Assignment</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body (Form) -->
            <div class="modal-body">
                <form id="createAssignmentForm">

                    <!-- Group 1: Title -->
                    <div class="form-group">
                        <label for="title">Assignment title <span class="required">*</span></label>
                        <input type="text" id="title" placeholder="e.g. Final Project - Group 1" required>
                    </div>

                    <!-- Nhóm 2: Flex row cho Deadline & Thang điểm -->
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="deadline">Submission deadline <span class="required">*</span></label>
                            <input type="datetime-local" id="deadline" required>
                        </div>

                        <div class="form-group flex-1">
                            <label for="maxScore">Max score <span class="required">*</span></label>
                            <input type="number" id="maxScore" value="10" min="1" max="100" required>
                        </div>
                    </div>

                    <!-- Nhóm 3: Mô tả/Yêu cầu -->
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4"
                            placeholder="Enter detailed instructions for learners..."></textarea>
                    </div>

                    <!-- Nhóm 4: Đính kèm file (Kéo thả/Click) -->
                    <div class="form-group">
                        <label>Attach required files (Documents, prompt)</label>
                        <div class="file-dropzone" id="dropzone">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <p>Drag and drop files here or <span class="text-blue">choose files</span></p>
                            <p class="file-hint">Supported: PDF, DOCX, ZIP (Max 10MB)</p>
                            <input type="file" id="fileInput" hidden multiple>
                        </div>
                    </div>

                </form>
            </div>

            <!-- Modal Footer (Nút bấm) -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="createAssignmentForm" class="btn btn-primary">Create Assignment</button>
            </div>

        </div>
    </div>

    <!-- JavaScript xử lý Modal cơ bản -->
    <script>
        const modal = document.getElementById('assignmentModal');
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        // Hàm mở/đóng Modal
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }

        // Click vào khu vực thả file sẽ kích hoạt thẻ input ẩn
        dropzone.addEventListener('click', () => {
            fileInput.click();
        });

        // Đóng modal nếu click ra ngoài vùng xám
        window.onclick = function (event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
