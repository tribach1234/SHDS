<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <link rel="stylesheet" href="Login.css?1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast-notification"></div>

    <div class="container">
        <!-- Login Form -->
        <div class="form-box login">
            <form id="loginForm" novalidate>
                <h1>Đăng nhập</h1>
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Mật khẩu">
                    <i class="fa-solid fa-lock password-icon"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn">Đăng nhập</button>
                <p>----- Đăng nhập nhanh -----</p>
                <div class="social-icons">
                    <a href="#">
                        <i class="fa-brands fa-google"></i>
                        <span>Đăng nhập nhanh với Google</span>
                    </a>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box register">
            <form id="registerForm" novalidate>
                <h1>Đăng ký</h1>
                <div class="input-box">
                    <input type="text" id="regName" placeholder="Họ và tên">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" id="regEmail" placeholder="Email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="regPassword" placeholder="Mật khẩu">
                    <i class="fa-solid fa-lock password-icon"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="regConfirmPassword" placeholder="Xác nhận lại mật khẩu">
                    <i class="fa-solid fa-lock password-icon"></i>
                </div>
                <button type="submit" class="btn">Đăng ký</button>
                <p>----- Đăng ký nhanh -----</p>
                <div class="social-icons">
                    <a href="#">
                        <i class="fa-brands fa-google"></i>
                        <span>Đăng ký nhanh với Google</span>
                    </a>
                </div>
            </form>
        </div>

        <!-- Toggle Box -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Đăng nhập tại đây</h1>
                <p>Bạn chưa có tài khoản ?</p>
                <button class="btn register-btn">Đăng ký</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Đăng ký tại đây</h1>
                <p>Bạn đã có tài khoản?</p>
                <button class="btn login-btn">Đăng nhập</button>
            </div>
        </div>
    </div>

    <script src="Login.js?1"></script>
</body>

</html>
